<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- hazard stripe -->
  <g>
    <clipPath id="strip"><rect x="0" y="332" width="1280" height="28"/></clipPath>
    <g clip-path="url(#strip)">
      <rect x="0" y="332" width="1280" height="28" fill="#fbbf24"/>
      <g fill="#111827">
        <path id="s" d="M0 360 L28 332 L56 332 L28 360Z"/>
        <use href="#s" x="56"/><use href="#s" x="112"/><use href="#s" x="168"/><use href="#s" x="224"/>
        <use href="#s" x="280"/><use href="#s" x="336"/><use href="#s" x="392"/><use href="#s" x="448"/>
        <use href="#s" x="504"/><use href="#s" x="560"/><use href="#s" x="616"/><use href="#s" x="672"/>
        <use href="#s" x="728"/><use href="#s" x="784"/><use href="#s" x="840"/><use href="#s" x="896"/>
        <use href="#s" x="952"/><use href="#s" x="1008"/><use href="#s" x="1064"/><use href="#s" x="1120"/>
        <use href="#s" x="1176"/><use href="#s" x="1232"/>
      </g>
    </g>
  </g>

  <!-- text -->
  <text x="70" y="110" font-size="20" font-weight="600" letter-spacing="4" fill="#fbbf24">NLP + EXPLORATORY DATA ANALYSIS</text>
  <text x="70" y="185" font-size="62" font-weight="800" fill="#f9fafb">OSHA Accident</text>
  <text x="70" y="252" font-size="62" font-weight="800" fill="url(#accent)">Report Analysis</text>
  <text x="70" y="298" font-size="22" fill="#9ca3af">What do workplace accident narratives reveal about risk?</text>

  <!-- hard hat -->
  <g transform="translate(850,70)">
    <circle cx="130" cy="130" r="120" fill="#fbbf24" fill-opacity="0.08"/>
    <path d="M30 150 A100 100 0 0 1 230 150Z" fill="#fbbf24"/>
    <rect x="115" y="38" width="30" height="112" rx="8" fill="#f59e0b"/>
    <rect x="10" y="150" width="240" height="22" rx="11" fill="#f59e0b"/>
    <path d="M55 130 A80 80 0 0 1 90 80" fill="none" stroke="#fde68a" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- text lines (NLP) -->
  <g transform="translate(1090,90)" stroke-linecap="round" stroke-width="8">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#6b7280"/>
    <line x1="0" y1="28" x2="70" y2="28" stroke="#fbbf24"/>
    <line x1="0" y1="56" x2="90" y2="56" stroke="#6b7280"/>
    <line x1="0" y1="84" x2="55" y2="84" stroke="#f97316"/>
  </g>

  <!-- mini bars (EDA) -->
  <g transform="translate(1090,220)" fill="#6b7280">
    <rect x="0" y="40" width="18" height="30" rx="3"/>
    <rect x="28" y="15" width="18" height="55" rx="3" fill="#fbbf24"/>
    <rect x="56" y="30" width="18" height="40" rx="3"/>
    <rect x="84" y="0" width="18" height="70" rx="3" fill="#f97316"/>
  </g>
</svg>
